name: Publica no ftm.app.br

# Espelha o deploy.yml do lps-ftm, sem passo de build: este site não tem um.
# Dispara também quando o "Atualiza os dados" commita — é o que mantém o
# ftm.app.br/interno/dados em dia sem ninguém tocar no servidor.
on:
  push:
    branches: [main]
  # Sem isto o site congelaria no último commit humano. O "Atualiza os dados"
  # commita com o GITHUB_TOKEN padrão, e o GitHub não deixa push feito com esse
  # token disparar outro workflow — justamente para não criar laço infinito. O
  # workflow_run é a saída oficial: ouve o outro terminar, em vez do push dele.
  workflow_run:
    workflows: ["Atualiza os dados"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    # rodada de dados que falhou não vira deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Enviar para o VPS
        # A chave do deploy é restrita a rsync dentro de /srv/apps (rrsync), por
        # isso o caminho remoto é relativo.
        #
        # Vai só o que o navegador precisa: os scripts de geração e as planilhas
        # ficam de fora (são a cozinha, não o prato — e a planilha sozinha tem
        # 2 MB). O --delete tira do servidor o que saiu do repositório.
        #
        # Três tentativas porque a rota runner(Azure) → VPS(Hostinger BR) cai de
        # vez em quando; é o mesmo remédio do lps-ftm.
        run: |
          for tentativa in 1 2 3; do
            echo "== rsync, tentativa $tentativa/3 =="
            if rsync -az --delete \
                 --exclude='.git*' --exclude='scripts/' --exclude='*.xlsx' \
                 --exclude='README.md' \
                 -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=30" \
                 ./ deploy@179.197.65.64:ftm-dados/current/; then
              echo "publicado na tentativa $tentativa"
              exit 0
            fi
            echo "tentativa $tentativa falhou"
            sleep 15
          done
          echo "as três tentativas falharam"
          exit 1
